<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>Página de Login</header>

    <main>
        <section id="login">
            <form>
                <fieldset>
                    <legend>Dados de entrada</legend>
                    <p>
                        <label for="email">E-Mail:</label>
                        <input
                            type="email"
                            name="email"
                            id="email"
                            required
                        >
                    </p>
                    <p>
                        <label for="senha">Senha:</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            required
                        >
                    </p>
                </fieldset>
                 <button type="submit">
                    Entrar
                 </button>
            </form>
           
        </section>
    </main>
    <footer>
        <p>Login DevWeb</p>

        <p>
            Voltar a pagina inicial?
            <a href="index.html">Voltar a página principal</a>
        </p>
    </footer>
    
</body>
</html>
